# aicampingmarketing.co.kr 자동 배포
#
# main 브랜치에 내용이 올라가면 → 빌드 → 소스 보기 검증 → GitHub Pages 배포.
# 검증이 실패하면 배포가 멈춘다. 깨진 페이지가 인터넷에 올라가지 않는다.
#
# npm install 이 없다는 점에 주목할 것. 이 저장소는 의존성 0개라
# 내려받을 패키지가 없고, 그래서 배포가 빠르고 깨지지 않는다.

name: aicampingmarketing.co.kr 배포

on:
  push:
    branches: [main]
  workflow_dispatch: # GitHub 화면에서 손으로 실행할 때 쓴다

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: 빌드와 검증
    runs-on: ubuntu-latest
    steps:
      - name: 소스 내려받기
        uses: actions/checkout@v4

      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # BASE_PATH 없음 — 2026-08-17 부터 aicampingmarketing.co.kr 루트 배포다.
      #
      #   전에는 BASE_PATH=/camphive-aeo 를 넣었다. github.io 임시 주소가
      #   /저장소이름/ 하위에서 열리기 때문이다. 도메인이 붙은 뒤에는 사이트가
      #   도메인 루트에서 제공되므로, 그 값이 남아 있으면 모든 링크가
      #   /camphive-aeo/... 로 나가 전 페이지 404 가 된다.
      #
      #   ⚠ 임시 주소(github.io/camphive-aeo/)로 되돌릴 일이 생기면 아래 두
      #     단계에 env: BASE_PATH: /camphive-aeo 를 다시 넣어야 한다.
      #     static/CNAME 삭제와 같은 커밋에서 해야 한다 — 따로 하면 그 사이
      #     구간에서 전 페이지가 404 다.
      - name: 빌드 (dist/ 생성)
        run: node build.mjs

      - name: 소스 보기 검증 — 실패하면 배포하지 않는다
        run: node verify.mjs

      - name: 결과물 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: 배포
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages에 올리기
        id: deployment
        uses: actions/deploy-pages@v4
